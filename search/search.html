<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Medical Library</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="search.css">
</head>
<body>
    <header>
        <h1>📚 Medical library</h1>
        <nav>
            <a href="../index.html">📚 Library</a>
            <a href="search.html">🔍 Search</a>
            <a href="../editor.html" data-role="admin">✏️ Editor</a>
            <a href="../manifest-editor.html" data-role="admin">🛠️ Manifests</a>
        </nav>
    </header>

    <main>
        <section class="category-section">
            <h2 class="category-title">🔍 Global Search</h2>

            <div class="search-box">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Enter your search query (e.g. anatomy, heart, аорта)..." autofocus>
                    <button id="searchButton" class="button button-primary">Search</button>
                </div>
            </div>

            <div id="filtersSection" class="filters-section" style="display: none;">
                <div class="filters-header">
                    <h3>Filters</h3>
                    <button id="clearFilters" class="button button-secondary button-small">Clear All</button>
                </div>
                <div class="filters-grid">
                    <div class="filter-group">
                        <label for="filterBook">📚 Book</label>
                        <select id="filterBook">
                            <option value="">All Books</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterLanguage">🌐 Language</label>
                        <select id="filterLanguage">
                            <option value="">All Languages</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterCategory">📁 Category</label>
                        <select id="filterCategory">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="loadingIndicator" class="loading" style="display: none;">
                <div class="spinner"></div>
                <span>Loading search index...</span>
            </div>

            <div id="resultsInfo" class="results-info"></div>

            <div id="viewToggle" class="view-toggle" style="display: none;">
                <button id="viewByBook" class="button button-secondary button-small active">📚 By Book</button>
                <button id="viewAll" class="button button-secondary button-small">📄 All Results</button>
            </div>

            <div id="resultsContainer">
                <div class="info">Enter a search query above to begin searching.</div>
            </div>

            <div id="paginationContainer"></div>
        </section>
    </main>

    <!-- Modal Structure -->
    <div id="chapterModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close-button">&times;</span>
                <h2 id="modalTitle"></h2>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Chapter content will be loaded here -->
            </div>
            <div class="modal-footer">
                <!-- Footer content will be loaded dynamically -->
            </div>
        </div>
    </div>

    <footer>
        <p>Starley Library | 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="search.js"></script>
</body>
</html>
