<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск по библиотеке</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="search.css">
</head>
<body>
    <div class="container">
        <h1>Поиск по библиотеке</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Введите запрос для поиска...">
            <button id="searchButton">Найти</button>
        </div>
            <div id="resultsContainer"></div>
        
            <!-- Modal Structure -->
            <div id="chapterModal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <span class="close-button">&times;</span>
                        <h2 id="modalTitle"></h2>
                    </div>
                    <div class="modal-body" id="modalBody">
                        <!-- Chapter content will be loaded here -->
                    </div>
                    <div class="modal-footer">
                        <a id="readFullButton" class="button" href="#" target="_blank">Читать в полном режиме</a>
                    </div>
                </div>
            </div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="https://unpkg.com/lunr/lunr.min.js"></script>
        <script src="search.js"></script></body>
</html>
