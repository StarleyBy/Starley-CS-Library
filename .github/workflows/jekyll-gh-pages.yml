name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true          # <-- добавили, пока в репо есть LFS-указатели

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Jekyll-сборку убрали целиком — сайт не нуждается в Jekyll,
      # это просто статический HTML/JS, .nojekyll и так это подтверждает

      - name: Clean dev-only files before upload
        run: rm -rf node_modules .qwen plans combain

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
