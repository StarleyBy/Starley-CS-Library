<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starley Medical Editor</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/editor.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>
    <!-- CodeMirror Fold Addons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldgutter.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldgutter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/xml-fold.min.js"></script>
</head>
<body>
    <header>
        <h1>📚 Medical library</h1>
        <nav>
            <a href="index.html">Library</a>
            <a href="editor.html">Editor</a>
        </nav>
    </header>
    <div class="editor-shell">
        <aside class="editor-toolbar">
            <!-- Загрузка файлов -->
            <div class="tool-group loader-group">
                <h4>📂 Load</h4>
                <select id="select-book"><option value="">Select a book...</option></select>
                <select id="select-chapter" disabled><option value="">Select a chapter...</option></select>
                
                <div class="icon-grid" style="margin-top: 10px;">
                    <button id="btn-load-original" class="btn-load" style="background: #3498db;" title="Load Original Version">📄</button>
                    <button id="btn-load-russian" class="btn-load" style="background: #e74c3c;" title="Load Russian Version">🇷🇺</button>
                    <button id="btn-load-starley" class="btn-load" style="background: #27ae60;" title="Load Starley Version">⭐</button>
                    <button id="btn-load-hebrew" class="btn-load" style="background: #2980b9;" title="Load Hebrew Version">עברית</button>
                </div>
            </div>

            <!-- Цветные овалы -->
            <div class="tool-group">
                <h4>⭕ Color Oval (3D)</h4>
                <div class="color-grid" id="oval-colors"></div>
            </div>

            <!-- Маркеры -->
            <div class="tool-group">
                <h4>🖍️ Marker</h4>
                <div class="color-grid" id="marker-colors"></div>
            </div>

            <!-- Специальные эффекты -->
            <div class="tool-group">
                <h4>✨ Special Effects</h4>
                <div class="icon-grid">
                    <button onclick="wrapInEffect('luminous-blue')" title="Luminous Blue">💎</button>
                    <button onclick="wrapInEffect('luminous-green')" title="Luminous Green">💚</button>
                    <button onclick="wrapInEffect('luminous-red')" title="Luminous Red">❤️</button>
                    <button onclick="wrapInEffect('luminous-yellow')" title="Luminous Yellow">💛</button>
                    <button onclick="wrapInEffect('luminous-purple')" title="Luminous Purple">💜</button>
                    <button onclick="wrapInEffect('cyber-neon cyber-neon-pink')" title="Neon Pink">⚡</button>
                    <button onclick="wrapInEffect('cyber-neon cyber-neon-blue')" title="Neon Blue">🔷</button>
                    <button onclick="wrapInEffect('cyber-glitch')" title="Glitch Effect">📺</button>
                    <button onclick="wrapInBlock('luminous-cyan')" title="Luminous Cyan">💠</button>
                    <button onclick="wrapInBlock('luminous-amber')" title="Luminous Amber">🔥</button>
                </div>
            </div>

            <!-- Info Boxes -->
            <div class="tool-group">
                <h4>📦 Info Boxes</h4>
                <div class="icon-grid">
                    <button onclick="wrapInInfoBox('info-box')" title="Default Info Box">📦</button>
                    <button onclick="wrapInInfoBox('info-box info-box-info')" title="Info Box">ℹ️</button>
                    <button onclick="wrapInInfoBox('info-box info-box-success')" title="Success Box">✅</button>
                    <button onclick="wrapInInfoBox('info-box info-box-warning')" title="Warning Box">⚠️</button>
                    <button onclick="wrapInInfoBox('info-box info-box-danger')" title="Danger Box">🚨</button>
                    <button onclick="addDetails()" title="Hidden Text (Details)">▶️</button>
                </div>
            </div>

            <!-- Цвета текста -->
            <div class="tool-group">
                <h4>🎨 Text Color</h4>
                <div class="color-grid" id="text-colors"></div>
            </div>

            <!-- Стандартные блоки -->
            <div class="tool-group">
                <h4>📦 Standard Blocks</h4>
                <div class="icon-grid">
                    <button onclick="insertAdmonition('note', 'Примечание')" title="Note Block">ℹ️</button>
                    <button onclick="insertAdmonition('tip', 'Совет')" title="Tip Block">💡</button>
                    <button onclick="insertAdmonition('info', 'Информация')" title="Info Block">📌</button>
                    <button onclick="insertAdmonition('warning', 'Предупреждение')" title="Warning Block">⚠️</button>
                    <button onclick="insertAdmonition('danger', 'Опасность')" title="Danger Block">🚨</button>
                    <button onclick="insertAdmonition('caution', 'Осторожно')" title="Caution Block">⚡</button>
                </div>
            </div>

            <!-- Медицинские блоки -->
            <div class="tool-group">
                <h4>🏥 Medical Blocks</h4>
                <div class="icon-grid-2">
                    <button onclick="insertAdmonition('dosage', 'Дозировка')" title="Dosage Block">💉</button>
                    <button onclick="insertAdmonition('contraindication', 'Противопоказания')" title="Contraindication Block">🚫</button>
                    <button onclick="insertAdmonition('side-effect', 'Побочные эффекты')" title="Side Effect Block">⚠️</button>
                    <button onclick="insertAdmonition('clinical', 'Клиника')" title="Clinical Block">🏥</button>
                    <button onclick="insertAdmonition('anatomy', 'Анатомия')" title="Anatomy Block">🫀</button>
                    <button onclick="insertAdmonition('physiology', 'Физиология')" title="Physiology Block">🧬</button>
                    <button onclick="insertAdmonition('surgery', 'Хирургия')" title="Surgery Block">🔪</button>
                    <button onclick="insertAdmonition('icu', 'Реанимация')" title="ICU Block">🚑</button>
                    <button onclick="insertAdmonition('evidence', 'Доказательства')" title="Evidence Block">📊</button>
                    <button onclick="insertAdmonition('protocol', 'Протокол')" title="Protocol Block">📋</button>
                </div>
            </div>

            <!-- Навигация -->
            <div class="tool-group">
                <h4>🔗 Navigation</h4>
                <div class="icon-grid">
                    <button onclick="insertLink()" title="Создать ссылку на термин">🔗</button>
                    <button onclick="insertAnchor()" title="Создать якорь в месте определения">⚓</button>
                    <button onclick="insertBackLink()" title="Умная кнопка - вернет к любой ссылке">↩️</button>
                </div>
            </div>

            <!-- Инструменты редактора -->
            <div class="tool-group">
                <h4>🔧 Editor Tools</h4>
                <div class="icon-grid">
                    <button onclick="window.highlightDetailsInEditor && window.highlightDetailsInEditor()" title="Обновить цветную подсветку <details>">🎨</button>
                    <button onclick="editor && editor.execCommand('foldAll')" title="Свернуть все блоки">📦</button>
                    <button onclick="editor && editor.execCommand('unfoldAll')" title="Развернуть все блоки">📂</button>
                </div>
            </div>

            <!-- Размер шрифта и заголовки -->
            <div class="tool-group">
                <h4>📤 Font Size & Headers</h4>
                <div class="icon-grid-4" style="margin-bottom: 8px;">
                    <button onclick="wrapInFontSize(60)" title="60% Font Size" style="font-size: 0.9em;">A⁻</button>
                    <button onclick="wrapInFontSize(75)" title="75% Font Size" style="font-size: 1em;">A⁻</button>
                    <button onclick="wrapInFontSize(90)" title="90% Font Size" style="font-size: 1.1em;">A</button>
                    <button onclick="wrapInFontSize(110)" title="110% Font Size" style="font-size: 1.3em;">A</button>
                    <button onclick="wrapInFontSize(125)" title="125% Font Size" style="font-size: 1.4em;">A⁺</button>
                </div>
                <div class="icon-grid-2" style="margin-bottom: 8px;">
                    <button onclick="wrapInHeader(1)" title="Header 1" style="font-size: 1.4em; font-weight: bold;">#</button>
                    <button onclick="wrapInHeader(2)" title="Header 2" style="font-size: 1.3em; font-weight: bold;">##</button>
                    <button onclick="wrapInHeader(3)" title="Header 3" style="font-size: 1.2em;">###</button>
                    <button onclick="wrapInHeader(4)" title="Header 4" style="font-size: 1.1em;">####</button>
                    <button onclick="wrapInHeader(5)" title="Header 5">#####</button>
                    <button onclick="wrapInHeader(6)" title="Header 6">######</button>
                </div>
                <div class="icon-grid">
                    <button onclick="wrapInSuperscript()" title="Superscript (верхний индекс)" style="font-size: 1.1em;">X<sup style="font-size: 0.7em;">2</sup></button>
                    <button onclick="wrapInSubscript()" title="Subscript (нижний индекс)" style="font-size: 1.1em;">H<sub style="font-size: 0.7em;">2</sub></button>
                    <button onclick="wrapInBold()" title="Bold (полужирный)" style="font-weight: bold; font-size: 1.2em;">B</button>
                    <button onclick="wrapInItalic()" title="Italic (курсив)" style="font-style: italic; font-size: 1.2em;">I</button>
                </div>
            </div>

            <!-- Символы и эмодзи -->
            <div class="tool-group">
                <h4 class="symbols-header" onclick="toggleSymbolsPanel()" style="cursor: pointer; user-select: none;">
                    🔣 Symbols & Emoji <span id="symbols-toggle">▼</span>
                </h4>
                <div id="symbols-panel" class="symbols-panel">
                    <!-- Панель будет заполнена через JavaScript -->
                </div>
            </div>

            <!-- Сохранение -->
            <div class="tool-group export-group">
                <h4>💾 Save</h4>
                <input type="text" id="export-filename" placeholder="chapter-01-starley.md">
                <button id="btn-download" class="btn-success" title="Download Markdown File">📤 Download</button>
            </div>
        </aside>

        <main class="editor-main">
            <div class="pane-header">Markdown Source</div>
            <textarea id="markdown-input" placeholder="Text will appear here after loading or paste it manually..."></textarea>
        </main>

        <section class="editor-preview-pane">
            <div class="pane-header">Live Preview</div>
            <div id="editor-preview" class="content"></div>
        </section>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/editor.js"></script>
</body>
</html>
