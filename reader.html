<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starley Medical Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Nunito:wght@400;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Literata:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/reader.css?v=1.2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="reader-body">
    <!-- Reading progress bar -->
    <div id="reading-progress-bar"></div>

    <header class="reader-header">
        <div class="header-content">
            <nav class="main-nav">
                <a href="index.html" class="nav-link">
                    <i class="fas fa-book-open"></i>
                    <span class="nav-text">Library</span>
                </a>
            </nav>
            <button id="toc-toggle" class="header-btn"><i class="fas fa-list"></i></button>
            <div id="version-selector-container"></div>
            <button id="bookmark-toggle" class="header-btn" title="Bookmarks"><i class="fas fa-bookmark"></i></button>
            <button id="focus-toggle" class="header-btn">
                <i class="fas fa-expand"></i>
                <i class="fas fa-compress"></i>
            </button>
        </div>
    </header>

    <div class="reader-layout">
        <aside id="reader-sidebar" class="sidebar">
            <h2 id="book-title">Loading...</h2>
            <div id="chapter-list" class="nav-list"></div>
            <hr>
            <div id="bookmarks-panel" class="bookmarks-panel" style="display:none">
                <div class="bookmarks-header">
                    <span>Bookmarks</span>
                    <button id="bookmarks-clear" class="bm-clear-btn" title="Clear all">✕ clear</button>
                </div>
                <div id="bookmarks-list" class="nav-list"></div>
                <hr>
            </div>
            <div id="internal-toc" class="nav-list"></div>
        </aside>

        <main id="main-content" class="content-wrapper">
            <article id="content-area" class="content"></article>
        </main>
    </div>

    <!-- Search panel -->
    <div id="search-panel" class="search-panel">
        <div class="search-inner">
            <input id="search-input" type="text" placeholder="Search in chapter…" autocomplete="off" spellcheck="false">
            <span id="search-count" class="search-count"></span>
            <button id="search-prev" class="search-nav" title="Previous">↑</button>
            <button id="search-next" class="search-nav" title="Next">↓</button>
            <button id="search-close" class="search-close" title="Close">✕</button>
        </div>
    </div>

    <!-- Radial menu -->
    <div id="radial-backdrop"></div>
    <div id="radial-menu-container">
        <!-- Font picker popup -->
        <div id="font-picker">
            <button class="font-option" data-font="inter">Inter <span class="font-tag">sans</span></button>
            <button class="font-option" data-font="roboto">Roboto <span class="font-tag">sans</span></button>
            <button class="font-option" data-font="opensans">Open Sans <span class="font-tag">sans</span></button>
            <button class="font-option" data-font="nunito">Nunito <span class="font-tag">sans</span></button>
            <button class="font-option" data-font="merriweather">Merriweather <span class="font-tag">serif</span></button>
            <button class="font-option" data-font="lora">Lora <span class="font-tag">serif</span></button>
            <button class="font-option" data-font="playfair">Playfair Display <span class="font-tag">serif</span></button>
            <button class="font-option" data-font="sourceserif">Source Serif 4 <span class="font-tag">serif</span></button>
            <button class="font-option" data-font="literata">Literata <span class="font-tag">serif · e-reader</span></button>
            <button class="font-option" data-font="mono">JetBrains Mono <span class="font-tag">mono</span></button>
        </div>
        <!-- Action buttons (order = animation order 1→8, positions set by JS) -->
        <div id="radial-items">
            <button class="radial-item ri-teal"   data-action="scroll-top"    data-tooltip="Scroll to top">↑</button>
            <button class="radial-item ri-green"  data-action="expand-all"    data-tooltip="Expand all">⊞</button>
            <button class="radial-item ri-orange" data-action="collapse-all"  data-tooltip="Collapse all">⊟</button>
            <button class="radial-item ri-blue"   data-action="font-increase" data-tooltip="Larger text" style="font-size:0.82rem">A+</button>
            <button class="radial-item ri-red"    data-action="font-decrease" data-tooltip="Smaller text" style="font-size:0.82rem">A−</button>
            <button class="radial-item ri-purple" data-action="font-pick"     data-tooltip="Choose font" style="font-size:0.8rem">Aa</button>
            <button class="radial-item ri-indigo" data-action="night-mode"    data-tooltip="Night mode">☾</button>
            <button class="radial-item ri-pink"   data-action="sepia-mode"    data-tooltip="Sepia mode">☕</button>
            <button class="radial-item ri-teal"   data-action="lh-increase"   data-tooltip="More spacing" style="font-size:0.7rem">≡+</button>
            <button class="radial-item ri-indigo" data-action="lh-decrease"   data-tooltip="Less spacing" style="font-size:0.7rem">≡−</button>
            <button class="radial-item ri-orange" data-action="text-width"    data-tooltip="Text width">↔</button>
            <button class="radial-item ri-green"  data-action="search-open"   data-tooltip="Search" style="font-size:0.95rem">🔍</button>
            <button class="radial-item ri-blue"   data-action="print-chapter" data-tooltip="Save as PDF" style="font-size:0.85rem">⎙</button>
        </div>
        <!-- Trigger button -->
        <button id="radial-trigger" title="Настройки чтения">
            <i class="fas fa-sliders-h"></i>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="assets/js/config.js?v=1.1"></script>
    <script src="assets/js/reader.js?v=1.1"></script>
    <script src="assets/js/navigation.js?v=1.1"></script>
</body>
</html>
